<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Affluents architecture — BRAND.md tokens: mist #F2F4F3 · ink #14232A ·
       river #23617A · reserve #B8893D · earn #35684F · contour #D9DFDD · muted #5A6A6E.
       The confluence glyph (streams → one channel → three branches) is the skeleton. -->
  <rect x="0" y="0" width="1600" height="760" rx="12" fill="#F2F4F3"/>

  <!-- zone boundary: Worker+D1 (left) / orchestrator (right) -->
  <line x1="560" y1="88" x2="560" y2="672" stroke="#D9DFDD" stroke-width="2" stroke-dasharray="7 7"/>

  <text x="60" y="70" font-size="24" font-weight="600" fill="#14232A">Cloudflare Worker + D1</text>
  <text x="60" y="98" font-size="16" fill="#5A6A6E">web app · JSON API · D1 is the state of record</text>

  <text x="600" y="70" font-size="24" font-weight="600" fill="#14232A">Orchestrator</text>
  <text x="600" y="98" font-size="16" fill="#5A6A6E">Node 22 · outbound-only · chain + Circle APIs (SCA wallets, Gas Station, App Kit)</text>

  <!-- internal API bridge -->
  <line x1="470" y1="630" x2="650" y2="630" stroke="#5A6A6E" stroke-width="2"/>
  <path d="M478 624 L466 630 L478 636 Z" fill="#5A6A6E"/>
  <path d="M642 624 L654 630 L642 636 Z" fill="#5A6A6E"/>
  <text x="560" y="662" font-size="15" fill="#5A6A6E" text-anchor="middle">authenticated internal API — all orchestrator state access</text>

  <!-- D1 store -->
  <rect x="270" y="150" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <text x="385" y="182" font-size="18" font-weight="600" fill="#14232A" text-anchor="middle">D1 — state of record</text>
  <text x="385" y="206" font-size="14.5" fill="#5A6A6E" text-anchor="middle">invoices · wallets · journal · ledger</text>
  <line x1="385" y1="226" x2="385" y2="300" stroke="#D9DFDD" stroke-width="2"/>

  <!-- client → payment page -->
  <rect x="56" y="300" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <text x="131" y="335" font-size="18" font-weight="600" fill="#14232A" text-anchor="middle">Client</text>
  <text x="131" y="359" font-size="14.5" fill="#5A6A6E" text-anchor="middle">pays USDC on Arc</text>

  <line x1="206" y1="340" x2="264" y2="340" stroke="#14232A" stroke-width="2"/>
  <path d="M258 334 L270 340 L258 346 Z" fill="#14232A"/>

  <rect x="270" y="300" width="230" height="80" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <text x="385" y="335" font-size="18" font-weight="600" fill="#14232A" text-anchor="middle">Payment link · QR</text>
  <text x="385" y="359" font-size="14.5" fill="#5A6A6E" text-anchor="middle">pay page · receipt portal</text>

  <line x1="500" y1="340" x2="604" y2="340" stroke="#14232A" stroke-width="2"/>
  <path d="M598 334 L610 340 L598 346 Z" fill="#14232A"/>

  <!-- deposit wallet -->
  <rect x="610" y="300" width="240" height="80" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <text x="730" y="335" font-size="18" font-weight="600" fill="#14232A" text-anchor="middle">Deposit wallet</text>
  <text x="730" y="359" font-size="14.5" fill="#5A6A6E" text-anchor="middle">Circle SCA — one per invoice</text>

  <!-- confluence glyph: streams converge into the channel -->
  <path d="M880 260 C928 260, 944 340, 972 340" fill="none" stroke="#14232A" stroke-width="3" stroke-linecap="round"/>
  <path d="M880 340 L972 340" fill="none" stroke="#14232A" stroke-width="3" stroke-linecap="round"/>
  <path d="M880 420 C928 420, 944 340, 972 340" fill="none" stroke="#14232A" stroke-width="3" stroke-linecap="round"/>
  <line x1="972" y1="340" x2="1180" y2="340" stroke="#14232A" stroke-width="3" stroke-linecap="round"/>

  <text x="1090" y="302" font-size="15.5" fill="#14232A" text-anchor="middle">verify — emitter-filtered, 6-dec</text>
  <text x="1090" y="384" font-size="15.5" fill="#14232A" text-anchor="middle">sweep — exact amount, gasless</text>

  <!-- intent journal strip -->
  <rect x="830" y="424" width="430" height="58" rx="8" fill="none" stroke="#5A6A6E" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1045" y="448" font-size="15" font-weight="600" fill="#14232A" text-anchor="middle">intent-first journal</text>
  <text x="1045" y="470" font-size="13.5" fill="#5A6A6E" text-anchor="middle">intent → sent → confirmed · idempotent · reconciled on restart</text>

  <!-- split into three branches -->
  <path d="M1180 340 C1236 340, 1252 200, 1332 200" fill="none" stroke="#23617A" stroke-width="3" stroke-linecap="round"/>
  <line x1="1180" y1="340" x2="1332" y2="340" stroke="#B8893D" stroke-width="3" stroke-linecap="round"/>
  <path d="M1180 340 C1236 340, 1252 480, 1332 480" fill="none" stroke="#35684F" stroke-width="3" stroke-linecap="round"/>

  <!-- Spend -->
  <rect x="1340" y="158" width="216" height="84" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <rect x="1340" y="158" width="5" height="84" rx="2.5" fill="#23617A"/>
  <text x="1362" y="192" font-size="18" font-weight="600" fill="#23617A">Spend — EURC</text>
  <text x="1362" y="216" font-size="14" fill="#5A6A6E">App Kit swap, live rate,</text>
  <text x="1362" y="234" font-size="14" fill="#5A6A6E">journaled stopLimit</text>

  <!-- Reserve -->
  <rect x="1340" y="298" width="216" height="84" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <rect x="1340" y="298" width="5" height="84" rx="2.5" fill="#B8893D"/>
  <text x="1362" y="332" font-size="18" font-weight="600" fill="#B8893D">Reserve — USDC</text>
  <text x="1362" y="356" font-size="14" fill="#5A6A6E">tax bucket, held as-is</text>

  <!-- Earn -->
  <rect x="1340" y="438" width="216" height="84" rx="8" fill="#FFFFFF" stroke="#D9DFDD" stroke-width="1.5"/>
  <rect x="1340" y="438" width="5" height="84" rx="2.5" fill="#35684F"/>
  <text x="1362" y="472" font-size="18" font-weight="600" fill="#35684F">Earn — DemoVault</text>
  <text x="1362" y="496" font-size="14" fill="#5A6A6E">ERC-4626, on-chain position,</text>
  <text x="1362" y="514" font-size="14" fill="#5A6A6E">two-way (withdrawals)</text>

  <!-- exception note -->
  <text x="1076" y="560" font-size="14.5" fill="#5A6A6E" text-anchor="middle">overpayments and unexpected payments → exception_hold — surfaced, never auto-routed</text>
</svg>
